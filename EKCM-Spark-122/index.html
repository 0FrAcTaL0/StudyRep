<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ЭКВМ «Искра-122»</title>
	<link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div class="app">
    <div class="workspace">
      <div class="instruction">
        <button id="instruction-button" type="button">Инструкция</button>
      </div>
      <div class="calculator">
        <div class="calc">
          <!-- Основной блок калькулятора -->
          <div class="calc_body">
            <!-- Декоративный верхний элемент -->
            <img class="top-svg" src="images/iskra-122-1.svg" alt="" role="presentation" />
            <!-- Табличка с названием -->
            <div class="calculator-title">
              <span id="label">ИСКРА-122</span>
            </div>
            <!-- Блок экрана -->
            <div class="screen-section">
              <div class="screen-holder">
                <div class="screen">
                  <!-- Экран состоит из 17 позиций:
                    1-я – знак минус (отдельный элемент)
                    2-16 – цифры (16 штук)
                    Между каждой парой цифр – точки (запятые) для имитации разрядов
                    Все элементы изначально скрыты (opacity: 0) и зажигаются через JS -->
                  <span class="screen-item digit">-</span><!-- Знак минус -->
                  <span class="screen-item digit">0</span><!-- Цифра разряда 16 -->
                  <span class="screen-item dot">.</span> 
                  <span class="screen-item digit">0</span><!-- Цифра разряда 15 -->
                  <span class="screen-item dot">.</span>  <!-- Точка между 15 и 14 разрядом -->
                  <span class="screen-item digit">0</span><!-- 14 разряд -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 13 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 12 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 11 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 10 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 9 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 8 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 7 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 6 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 5 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 4 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 3 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 2 -->
                  <span class="screen-item dot">.</span>
                  <span class="screen-item digit">0</span><!-- 1 (младший разряд) -->
                  <span class="screen-item dot">.</span>
                </div>
              </div>
            </div>
            <!-- Переключатель включения -->
            <div class="switch-row">
              <div class="onoffswitch">
                <!-- Чекбокс для выключателя (стилизован через CSS) -->
                <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox" id="myonoffswitch" aria-label="Включить калькулятор" />
                <label class="onoffswitch-label" for="myonoffswitch">
                  <span class="onoffswitch-inner"></span>
                  <span class="onoffswitch-switch"></span>
                </label>
              </div>
            </div>
            <!-- Клавиатура -->
            <div class="keyboard">
              <!-- Переключатель точности вычислений (число значащих цифр) -->
              <div class="precision">
                <div class="precision-row">
                  <button type="button" class="precision-button" data-precision="0" aria-label="Точность: без ограничения"></button>
                  <button type="button" class="precision-button" data-precision="13" aria-label="Точность: 13 разрядов"></button>
                  <button type="button" class="precision-button" data-precision="11" aria-label="Точность: 11 разрядов"></button>
                  <button type="button" class="precision-button" data-precision="9" aria-label="Точность: 9 разрядов"></button>
                  <button type="button" class="precision-button" data-precision="7" aria-label="Точность: 7 разрядов"></button>
                  <button type="button" class="precision-button" data-precision="5" aria-label="Точность: 5 разрядов"></button>
                  <button type="button" class="precision-button" data-precision="3" aria-label="Точность: 3 разряда"></button>
                </div>
                <div class="precision-row-labels">
                  <p>B</p>
                  <p data-value="13">13</p><p data-value="11">11</p><p data-value="9">9</p>
                  <p data-value="7">7</p><p data-value="5">5</p><p data-value="3">3</p>
                </div>
              </div>
              <!-- Первая панель: А5, Ск, А4, А1, А3, А2, 3, 2 -->
              <div class="keys-memory">
                <button type="button" class="memory-button" value="A5">A5</button>
                <button type="button" class="big-button" value="СК">CK</button>   <!-- Сброс/очистка -->
                <button type="button" class="memory-button" value="A4">A4</button>
                <button type="button" class="memory-button" value="A1">A1</button> <!-- Регистр памяти 1 -->
                <button type="button" class="memory-button" value="A3">A3</button>
                <button type="button" class="memory-button" value="A2">A2</button>
                <button type="button" class="memory-button" value="3"><span class="circle-value">3</span></button>
                <button type="button" class="memory-button" value="2"><span class="circle-value">2</span></button>
              </div>
              <!-- Вторая панель: цифры и точка -->
              <div class="digits">
                <button type="button" value="7">7</button>
                <button type="button" value="8">8</button>
                <button type="button" value="9">9</button>
                <button type="button" value="4">4</button>
                <button type="button" value="5">5</button>
                <button type="button" value="6">6</button>
                <button type="button" value="1">1</button>
                <button type="button" value="2">2</button>
                <button type="button" value="3">3</button>
                <button type="button" value="0">0</button>
                <button type="button" value=".">.</button><!-- Десятичная точка -->
              </div>
              <!-- Третья панель: стандартные операции + обратное деление, 
                                  смена знака, возведение в степень -->
              <div class="operations">
                <button type="button" class="math-button" value="-" aria-label="Вычитание">−</button>
                <button type="button" class="math-button" value="/" aria-label="Деление">÷</button>
                <button type="button" class="math-button" value="invdiv" aria-label="Обратное деление">ģ</button>
                <button type="button" class="math-button" value="+" aria-label="Сложение">+</button>
                <button type="button" class="math-button" value="*" aria-label="Умножение">•</button>
                <button type="button" class="math-button" value="√" aria-label="Квадратный корень">√</button>
                <button type="button" class="math-button" value="**" aria-label="Возведение в степень">↑</button>
                <button type="button" class="math-button" value="=" aria-label="Равно">=</button>
                <button type="button" class="math-button" value="/-/" aria-label="Смена знака">/-/</button>
              </div>
              <!-- Четвертая панель: вывод в печать, выделение целой части, скобки -->
              <div class="additional">
                <!-- onclick убран, id добавлен: обработчик печати теперь
                      вешается в script.js (см. dom.printButton). -->
                <button type="button" class="big-button" value="()" aria-label="Вывод регистра клавиатуры">ˆ</button><!-- Печать -->
                <button type="button" class="big-button" value="ВЦ" aria-label="Выделение целой части">/</button>
                <button type="button" class="math-button" value=")">)</button>
                <button type="button" class="math-button" value="(">(</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Блок регистров и флагов (отображает состояние памяти и флаги) -->
      <div class="registers">
        <div class="memory_flags">
          <div class="memory">
            <!-- Регистры A1–A5 (сохраняемые числа).
                  .register-display заполняется скриптом динамически: одна строка
                  .register-digit на каждое значение в стеке регистра (верхнее -
                  то, что уйдёт на экран следующим при извлечении).
                  .register-count - бейдж с количеством значений в стеке; заметен
                  только у A2/A3, куда можно положить больше одного числа. -->
            <div class="register" id="register_A1">
              <label>A1 =</label>
              <div class="register-display"><span class="register-digit">0</span></div>
              <span class="register-count"></span>
            </div>
            <div class="register" id="register_A2">
              <label>A2 =</label>
              <div class="register-display"><span class="register-digit">0</span></div>
              <span class="register-count"></span>
            </div>
            <div class="register" id="register_A3">
              <label>A3 =</label>
              <div class="register-display"><span class="register-digit">0</span></div>
              <span class="register-count"></span>
            </div>
            <div class="register" id="register_A4">
              <label>A4 =</label>
              <div class="register-display"><span class="register-digit">0</span></div>
              <span class="register-count"></span>
            </div>
            <div class="register" id="register_A5">
              <label>A5 =</label>
              <div class="register-display"><span class="register-digit">0</span></div>
              <span class="register-count"></span>
            </div>
            <div class="register" id="register_KL">
              <label>KB =</label>
              <div class="register-display"><span class="register-digit">0</span></div>
              <span class="register-count"></span>
            </div>
          </div>
          <!-- Блок флагов состояния -->
          <div class="flags">
            <div class="flag"><label>OP:</label><span id="flag_operation">0</span></div>        <!-- Операция -->
            <div class="flag"><label>OF:</label><span id="flag_overflow">0</span></div>         <!-- Переполнение -->
            <div class="flag"><label>PF:</label><span id="flag_precision">0</span></div>        <!-- Точность вычисления -->
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Подключение JavaScript -->
  <script src="./script.js"></script>
</body>
</html>
